# Deploy to Cloud Run. Manual-dispatch until the GCP side is wired up, so a
# half-configured pipeline can't fail every push.
#
# Before switching this to `on: push`, set up in GitHub → Settings → Secrets:
#   GCP_PROJECT_ID            your project id
#   GCP_WIF_PROVIDER          projects/N/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_SERVICE_ACCOUNT       deployer@PROJECT.iam.gserviceaccount.com
#   GCP_SQL_CONNECTION_NAME   PROJECT:REGION:INSTANCE  (not a secret, but it keeps
#                             the project id out of the workflow file)
# Workload Identity Federation, not a service-account JSON key — a long-lived
# key in a repo secret is the thing you'd get asked about in a security review.

name: deploy

on:
  workflow_dispatch:

env:
  SERVICE: compendium
  REGION: asia-southeast1 # Singapore

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Source deploy: Cloud Build builds the Dockerfile server-side, so no
      # local Docker daemon and no registry plumbing to maintain.
      #
      # --set-secrets REPLACES the whole set rather than merging, so every secret
      # the service needs has to be named here. OPENAI_API_KEY is not optional any
      # more: retrieval embeds the question, and without the key it silently falls
      # back to lexical-only search. That failure is invisible from the landing
      # page, because both example answers are served from a recording — the demo
      # would look perfect while every real question got worse results.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.GCP_SQL_CONNECTION_NAME }}" \
            --set-secrets "DATABASE_URL=database-url:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest" \
            --max-instances 3

      # A deploy that returns 200 from the platform but 503 from the app is the
      # normal failure here — usually the database. Fail the run loudly instead of
      # leaving a red service behind a green tick.
      - name: Verify the revision is actually serving
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "${{ secrets.GCP_PROJECT_ID }}" --region "$REGION" \
            --format='value(status.url)')
          echo "deployed: $URL"
          curl -fsS "$URL/livez" > /dev/null && echo "livez ok"
          curl -fsS "$URL/readyz" > /dev/null && echo "readyz ok (database reachable)"
          curl -fsS "$URL/corpus"

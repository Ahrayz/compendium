# Local dev database. Matches what the app expects in production:
# Postgres with the pgvector extension available.
#
#   docker compose up -d
#   python migrations/run.py
#
# Requires Docker (Docker Desktop on Windows/macOS; admin needed to install).

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: compendium-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compendium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `python migrations/run.py` immediately after `up -d` fails without this —
      # the container accepts TCP well before Postgres is ready for queries.
      test: ["CMD-SHELL", "pg_isready -U postgres -d compendium"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
